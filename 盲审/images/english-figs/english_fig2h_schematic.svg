<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60mm" height="40mm" font-family="Arial, Helvetica, sans-serif" font-size="2.12">

 <rect width="60" height="40" fill="white"/>

 <defs>
  <marker id="arr" markerWidth="1.5" markerHeight="1.2" refX="1.5" refY="0.6" orient="auto">
   <polygon points="0,0 1.5,0.6 0,1.2" fill="#C62828"/>
  </marker>
 </defs>

 <!-- ================================================================ -->
 <!-- LEFT COLUMN: Brain + virus info (x: 0–20)                        -->
 <!-- ================================================================ -->

