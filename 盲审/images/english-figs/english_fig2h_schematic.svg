 </g>
 <!-- scale 0.017: x range -310..315 -> -5.3..5.4, y range -60..380 -> +1.0..-6.5 
      translate(9,10): brain x=3.7..14.4, brain y=3.5..11.0 -->
 
 <!-- Midline -->
 <line x1="9" y1="3.5" x2="9" y2="10" stroke="#555" stroke-width="0.12" stroke-dasharray="0.5,0.4"/>
 <!-- MOp regions -->
 <ellipse cx="6.2" cy="5.5" rx="1.4" ry="1" fill="#EF9A9A" stroke="#C62828" stroke-width="0.2" opacity="0.4"/>
 <ellipse cx="11.8" cy="5.5" rx="1.4" ry="1" fill="#EF9A9A" stroke="#C62828" stroke-width="0.2" opacity="0.4"/>
 <!-- Injection emoji on brain — rotated 135° so needle points down-right into brain -->
 <g transform="translate(6.2,2.5) rotate(135)"><text x="0" y="0" text-anchor="middle" font-size="1.5">💉</text></g>
 <g transform="translate(11.8,2.5) rotate(135)"><text x="0" y="0" text-anchor="middle" font-size="1.5">💉</text></g>
 <!-- MOp labels -->
 <text x="6.2" y="6.8" text-anchor="middle" fill="#C62828" font-weight="bold">MOp</text>
 <text x="11.8" y="6.8" text-anchor="middle" fill="#C62828" font-weight="bold">MOp</text>

 <!-- Virus name — pushed down with gap from brain bottom (y=11) -->
 <text x="1.5" y="13" fill="#333">hSyn-DIO-</text>
 <text x="1.5" y="15" fill="#333">hM4D(Gi)-mCherry</text>

 <!-- Mouse line label -->
 <text x="9" y="17.5" text-anchor="middle" fill="#333" font-style="italic">cFos-CreER mice</text>

 <!-- Mouse silhouette (from Figure 1A) — shifted up -->
 <g transform="translate(1,0)">
  <path d="m 15.40768,27.68311 -2.369788,-0.384419 -0.724101,-0.516573 c -0.07896,-0.04806 -0.184317,-0.01196 -0.210645,0.07209 l -0.157985,0.57663 c -0.566121,-0.432479 -1.421875,-0.720797 -2.3829499,-0.756831 -1.342878,-0.03607 -2.54093,0.852944 -2.659417,2.078292 -0.03946,0.372413 0.02635,0.720806 0.157985,1.033144 -0.737272,-0.432471 -1.224384,-1.177297 -1.224384,-2.030241 0,-1.321461 1.171724,-2.390642 2.619923,-2.402665 0.131652,0 0.263309,-0.08409 0.276467,-0.204227 0.02631,-0.156171 -0.10532,-0.276304 -0.263293,-0.276304 -1.724683,0 -3.133392,1.261403 -3.15972,2.835144 -0.02631,1.609783 1.461369,2.931245 3.225538,2.931245 h 1.382369 c 0.2238189,0 0.3949659,-0.156179 0.3949659,-0.360399 0,-0.204227 -0.171147,-0.360406 -0.3949659,-0.360406 h -0.631935 c 0.184313,-0.120133 0.302795,-0.312339 0.302795,-0.54059 0,-0.288322 -0.210645,-0.55262 -0.513448,-0.636707 -0.105329,-0.02404 -0.157989,-0.132147 -0.131657,-0.228259 0.02635,-0.0961 0.144835,-0.144153 0.250155,-0.120125 0.473947,0.132147 0.803094,0.528584 0.803094,0.973069 0,0.06011 -0.01311,0.120133 -0.02635,0.180199 0.4081199,0.02404 0.7504299,0.336378 0.7504299,0.720805 0,0.0841 -0.01311,0.168185 -0.05264,0.240266 0.342294,0.07209 0.750422,0.120133 1.23755,0.120133 h 1.18489 c 0.223819,0 0.394962,-0.156179 0.394962,-0.360399 0,-0.204227 -0.171143,-0.360398 -0.394962,-0.360398 h -0.394966 l 2.962228,-1.465623 c 0.118495,-0.06011 0.184317,-0.168193 0.197479,-0.276312 0,-0.228247 -0.197479,-0.432471 -0.447626,-0.480531 z" fill="#333" stroke-width="0.125762"/>
 </g>
 <!-- mouse path y range: ~26.7 to 30.6 with translate(1,0) -> y=26.7..30.6 -->
 
 <!-- CNO i.p. label well below mouse (y=30.6 + gap) -->
 <text x="3" y="33" fill="#C62828">💉 CNO i.p.</text>

 <!-- ================================================================ -->
 <!-- RIGHT COLUMN: Timelines (x: 22–58)                               -->
 <!-- ================================================================ -->

 <!-- === Exp group (y: 2–11) === -->
 <text x="22" y="6.5" font-weight="bold" fill="#C62828">Exp</text>

 <!-- Virus mark — simple dashed line + label -->
 <line x1="26" y1="3.5" x2="26" y2="8.5" stroke="#888" stroke-width="0.2" stroke-dasharray="0.4,0.3"/>
 <text x="26" y="2.8" text-anchor="middle" fill="#555" font-size="1.6">Virus</text>

 <!-- 🔊💧 Train bar (orange) -->
 <rect x="28" y="4.5" width="8" height="3.2" fill="#FF9800" rx="0.3"/>
 <text x="32" y="6.8" text-anchor="middle" font-size="2.5">🔊💧</text>

 <!-- TM label below -->
 <text x="32" y="9.8" text-anchor="middle" fill="#1565C0">TM</text>

 <!-- 1 wk gap -->
 <line x1="36" y1="6.1" x2="40.5" y2="6.1" stroke="#999" stroke-width="0.15" stroke-dasharray="0.5,0.3"/>
 <text x="38.25" y="9.3" text-anchor="middle" fill="#888">1 wk</text>

 <!-- CNO label above LW bar -->
 <text x="45" y="2.8" text-anchor="middle" fill="#C62828" font-weight="bold">CNO</text>
 <line x1="45" y1="3.1" x2="45" y2="4.3" stroke="#C62828" stroke-width="0.3" marker-end="url(#arr)"/>

 <!-- 💡💧 Transfer bar (green) -->
 <rect x="40.5" y="4.5" width="8" height="3.2" fill="#4CAF50" rx="0.3"/>
 <text x="44.5" y="6.8" text-anchor="middle" font-size="2.5">💡💧</text>

 <!-- ... -->
 <text x="50" y="6.5" fill="#888">…</text>

 <!-- ================================================================ -->
 <!-- Divider                                                           -->
 <!-- ================================================================ -->
 <line x1="21" y1="12" x2="56" y2="12" stroke="#CCC" stroke-width="0.15" stroke-dasharray="0.8,0.5"/>

 <!-- === Ctrl group (y: 13–22) === -->
 <text x="22" y="17" font-weight="bold" fill="#2E7D32">Ctrl</text>

 <!-- Virus mark -->
 <line x1="26" y1="14" x2="26" y2="19" stroke="#888" stroke-width="0.2" stroke-dasharray="0.4,0.3"/>
 <text x="26" y="13.3" text-anchor="middle" fill="#555" font-size="1.6">Virus</text>

 <!-- Home cage bar (grey) -->
 <rect x="28" y="15" width="8" height="3.2" fill="#BDBDBD" rx="0.3"/>
 <text x="32" y="17.2" text-anchor="middle" fill="white" font-weight="bold">h.c.</text>

 <!-- TM label -->
 <text x="32" y="20.3" text-anchor="middle" fill="#1565C0">TM</text>

 <!-- 1 wk gap -->
 <line x1="36" y1="16.6" x2="40.5" y2="16.6" stroke="#999" stroke-width="0.15" stroke-dasharray="0.5,0.3"/>
 <text x="38.25" y="19.8" text-anchor="middle" fill="#888">1 wk</text>

 <!-- CNO label -->
 <text x="45" y="13.3" text-anchor="middle" fill="#C62828" font-weight="bold">CNO</text>
 <line x1="45" y1="13.6" x2="45" y2="14.8" stroke="#C62828" stroke-width="0.3" marker-end="url(#arr)"/>

 <!-- 💡💧 Transfer bar (green) -->
 <rect x="40.5" y="15" width="8" height="3.2" fill="#4CAF50" rx="0.3"/>
 <text x="44.5" y="17.2" text-anchor="middle" font-size="2.5">💡💧</text>

 <!-- ... -->
 <text x="50" y="17" fill="#888">…</text>

 <!-- ================================================================ -->
 <!-- BOTTOM: Compact annotation (y: 23–39)                            -->
 <!-- ================================================================ -->
 <line x1="21" y1="22.5" x2="56" y2="22.5" stroke="#CCC" stroke-width="0.1"/>

 <text x="21" y="25.5" fill="#C62828" font-weight="bold">Exp:</text>
 <text x="26" y="25.5" fill="#555">🔊💧 neurons labeled by TM</text>
 <text x="26" y="28" fill="#555">→ silenced by CNO in 💡💧</text>

 <text x="21" y="31.5" fill="#2E7D32" font-weight="bold">Ctrl:</text>
 <text x="26" y="31.5" fill="#555">TM in h.c. → no labeling</text>
 <text x="26" y="34" fill="#555">→ CNO has no effect</text>

</svg>
