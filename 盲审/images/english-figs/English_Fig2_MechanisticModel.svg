 <line x1="67.5" y1="9" x2="73" y2="7.5" stroke="#C62828" stroke-width="0.15" opacity="0.4"/>
 <line x1="73" y1="7.5" x2="78.5" y2="9" stroke="#C62828" stroke-width="0.15" opacity="0.4"/>
 <line x1="78.5" y1="9" x2="76" y2="13.5" stroke="#C62828" stroke-width="0.15" opacity="0.4"/>
 <line x1="76" y1="13.5" x2="70" y2="13.5" stroke="#C62828" stroke-width="0.15" opacity="0.4"/>
 <line x1="70" y1="13.5" x2="67.5" y2="9" stroke="#C62828" stroke-width="0.15" opacity="0.4"/>
 <line x1="73" y1="7.5" x2="70" y2="13.5" stroke="#C62828" stroke-width="0.15" opacity="0.4"/>
 <line x1="73" y1="7.5" x2="76" y2="13.5" stroke="#C62828" stroke-width="0.15" opacity="0.4"/>

 <!-- Gray cells -->
 <circle cx="65" cy="14" r="1" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.15"/>
 <circle cx="81" cy="13" r="1" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.15"/>
 <circle cx="68" cy="18" r="1" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.15"/>
 <circle cx="74" cy="18.5" r="1" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.15"/>
 <circle cx="80" cy="17" r="1" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.15"/>

 <!-- Converging trajectories -->
 <text x="62" y="25.5" text-anchor="middle" fill="#888">💡</text>
 <line x1="62" y1="26.5" x2="62" y2="27.5" stroke="#999" stroke-width="0.15"/>

 <path d="M62,27 C65,26 67,25.5 70,25.2 C73,25 76,24.8 79,24.7" fill="none" stroke="#E57373" stroke-width="0.35" opacity="0.85"/>
 <path d="M62,27 C65,26.7 67,26.5 70,26.3 C73,26.2 76,26 79,25.9" fill="none" stroke="#64B5F6" stroke-width="0.35" opacity="0.85"/>
 <path d="M62,27 C65,27 67,27 70,27 C73,27 76,27 79,26.8" fill="none" stroke="#81C784" stroke-width="0.35" opacity="0.85"/>

 <!-- Convergence bracket -->
 <path d="M80,24.7 C82,24.7 82,26.8 80,26.8" fill="none" stroke="#2E7D32" stroke-width="0.2"/>
 <text x="83" y="26.2" text-anchor="start" fill="#2E7D32" font-weight="bold">Low</text>
 <text x="83" y="28.4" text-anchor="start" fill="#2E7D32" font-weight="bold">div</text>

 <text x="73" y="38.5" text-anchor="middle" fill="#2E7D32" font-weight="bold">↑ Hit rate</text>

</svg>
