<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 40" width="90mm" height="40mm" font-family="Arial, Helvetica, sans-serif" font-size="2.1">

 <rect width="90" height="40" fill="white"/>

 <defs>
  <marker id="triBlue" markerWidth="3" markerHeight="2" refX="3" refY="1" orient="auto">
   <polygon points="0,0 3,1 0,2" fill="#1565C0"/>
  </marker>
  <marker id="triBk" markerWidth="3" markerHeight="2" refX="3" refY="1" orient="auto">
   <polygon points="0,0 3,1 0,2" fill="#555"/>
  </marker>
 </defs>

 <!-- ============================================================ -->
 <!-- LEFT COLUMN: Naive (x=0..30)                                 -->
 <!-- ============================================================ -->
 <text x="15" y="3.5" text-anchor="middle" fill="#333" font-weight="bold">Naïve</text>

 <!-- MOp population -->
 <ellipse cx="15" cy="13" rx="11" ry="9" fill="#FAFAFA" stroke="#ccc" stroke-width="0.3" stroke-dasharray="1,0.7"/>

 <!-- Gray neurons -->
 <circle cx="9" cy="8" r="1.3" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.2"/>
 <circle cx="15" cy="7" r="1.3" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.2"/>
 <circle cx="21" cy="8" r="1.3" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.2"/>
 <circle cx="8" cy="13" r="1.3" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.2"/>
 <circle cx="13" cy="12" r="1.3" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.2"/>
 <circle cx="18" cy="12" r="1.3" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.2"/>
 <circle cx="22" cy="13.5" r="1.3" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.2"/>
 <circle cx="10" cy="17" r="1.3" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.2"/>
 <circle cx="15" cy="16.5" r="1.3" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.2"/>
 <circle cx="20" cy="17" r="1.3" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.2"/>

 <!-- Diverging trajectories below -->
 <text x="3" y="25.5" text-anchor="middle" fill="#888">💡</text>
 <line x1="3" y1="26.5" x2="3" y2="27.5" stroke="#999" stroke-width="0.15"/>

 <path d="M3,27 C5,26 8,25 11,24 C13,23.5 16,23 19,22.5" fill="none" stroke="#E57373" stroke-width="0.35" opacity="0.85"/>
 <path d="M3,27 C6,27.5 9,28 12,28.5 C14,29 17,29 20,29" fill="none" stroke="#64B5F6" stroke-width="0.35" opacity="0.85"/>
 <path d="M3,27 C5,28 8,30 11,32 C13,33.5 16,34.5 19,35" fill="none" stroke="#81C784" stroke-width="0.35" opacity="0.85"/>

 <!-- Divergence bracket -->
 <path d="M21,23 C23,23 23,34.5 21,34.5" fill="none" stroke="#D32F2F" stroke-width="0.2"/>
 <text x="24" y="28" text-anchor="start" fill="#D32F2F" font-weight="bold">High</text>
 <text x="24" y="30.2" text-anchor="start" fill="#D32F2F" font-weight="bold">divergence</text>

 <text x="15" y="38.5" text-anchor="middle" fill="#D32F2F" font-weight="bold">↓ Hit rate</text>

 <!-- ============================================================ -->
 <!-- CENTER COLUMN: Learning + Ensemble (x=30..60)                -->
 <!-- ============================================================ -->

 <!-- Learning label + arrow -->
 <text x="45" y="3.5" text-anchor="middle" fill="#1565C0" font-weight="bold">🔊💧 Learning</text>

 <!-- Arrows from Naive to Ensemble -->
 <line x1="27" y1="13" x2="35" y2="13" stroke="#1565C0" stroke-width="0.5" marker-end="url(#triBlue)"/>

 <!-- Learned ensemble -->
 <ellipse cx="45" cy="13" rx="8" ry="7.5" fill="#FFF5F5" stroke="#E57373" stroke-width="0.2" stroke-dasharray="1,0.7"/>

 <circle cx="41" cy="10" r="1.3" fill="#EF5350" stroke="#C62828" stroke-width="0.25"/>
