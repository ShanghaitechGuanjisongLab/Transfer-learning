 <line x1="43" y1="14.5" x2="41" y2="10" stroke="#C62828" stroke-width="0.15" opacity="0.4"/>
 <line x1="45" y1="8.5" x2="43" y2="14.5" stroke="#C62828" stroke-width="0.15" opacity="0.4"/>
 <line x1="45" y1="8.5" x2="47" y2="14.5" stroke="#C62828" stroke-width="0.15" opacity="0.4"/>

 <!-- Gray cells -->
 <circle cx="39" cy="16" r="0.9" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.15"/>
 <circle cx="51" cy="15" r="0.9" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.15"/>
 <circle cx="42" cy="18.5" r="0.9" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.15"/>
 <circle cx="48" cy="18" r="0.9" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.15"/>

 <text x="45" y="24" text-anchor="middle" fill="#C62828" font-weight="bold">Learned ensemble</text>
 <text x="45" y="26.5" text-anchor="middle" fill="#888">~15% cells, ~40% signal</text>

 <!-- Reactivation arrow to Transfer -->
 <path d="M54,12 C56,10 58,9 61,9" fill="none" stroke="#555" stroke-width="0.35" marker-end="url(#triBk)"/>
 <text x="57" y="7" text-anchor="middle" fill="#FF8F00">💡</text>
 <text x="57" y="5.5" text-anchor="middle" fill="#555" font-style="italic">reactivated</text>

 <!-- Legend -->
 <circle cx="37" cy="31" r="1" fill="#EF5350" stroke="#C62828" stroke-width="0.2"/>
 <text x="39" y="31.7" fill="#555">Inherited</text>
 <circle cx="37" cy="34" r="1" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.2"/>
 <text x="39" y="34.7" fill="#555">Other</text>

 <line x1="48" y1="31" x2="51" y2="31" stroke="#E57373" stroke-width="0.35"/>
 <line x1="48" y1="33" x2="51" y2="33" stroke="#64B5F6" stroke-width="0.35"/>
 <line x1="48" y1="35" x2="51" y2="35" stroke="#81C784" stroke-width="0.35"/>
 <text x="52" y="31.7" fill="#555">Trial 1</text>
 <text x="52" y="33.7" fill="#555">Trial 2</text>
 <text x="52" y="35.7" fill="#555">Trial 3</text>

 <!-- ============================================================ -->
 <!-- RIGHT COLUMN: Transfer (x=58..88)                            -->
 <!-- ============================================================ -->
 <text x="73" y="3.5" text-anchor="middle" fill="#333" font-weight="bold">Transfer</text>

 <!-- MOp population -->
 <ellipse cx="73" cy="13" rx="10" ry="9" fill="#FAFAFA" stroke="#ccc" stroke-width="0.3" stroke-dasharray="1,0.7"/>

 <!-- Inherited ensemble -->
 <circle cx="67.5" cy="9" r="1.3" fill="#EF5350" stroke="#C62828" stroke-width="0.3"/>
