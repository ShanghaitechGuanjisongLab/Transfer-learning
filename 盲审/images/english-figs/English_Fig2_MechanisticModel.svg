 <circle cx="78.5" cy="9" r="1.3" fill="#EF5350" stroke="#C62828" stroke-width="0.3"/>
 <circle cx="70" cy="13.5" r="1.3" fill="#EF5350" stroke="#C62828" stroke-width="0.3"/>
