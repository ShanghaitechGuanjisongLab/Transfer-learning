<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Concept model: Naïve vs Transfer learning mechanism -->

<svg
   width="60mm"
   height="39.999996mm"
   viewBox="0 0 60 39.999998"
   version="1.1"
   id="svg1"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   sodipodi:docname="3K.svg"
   xml:space="preserve"
   inkscape:export-filename="图3.png"
   inkscape:export-xdpi="500"
   inkscape:export-ydpi="500"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"><sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:document-units="mm"
     inkscape:zoom="1.4485269"
     inkscape:cx="159.81754"
     inkscape:cy="259.91923"
     inkscape:window-width="1920"
     inkscape:window-height="1009"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="layer1"
     showgrid="true"><inkscape:grid
       id="grid7"
       units="mm"
       originx="-59.999996"
       originy="-80"
       spacingx="15"
       spacingy="40.000001"
       empcolor="#0099e5"
       empopacity="0.30196078"
       color="#0099e5"
       opacity="0.14901961"
       empspacing="5"
       enabled="true"
       visible="true" /><inkscape:page
       x="0"
       y="0"
       width="60"
       height="39.999996"
       id="page1"
       margin="0"
       bleed="0" /></sodipodi:namedview><defs
     id="defs1" /><g
     inkscape:label="图层 1"
     inkscape:groupmode="layer"
     id="layer1"
     transform="translate(-180,-80.000006)"><g
       style="font-size:2.1px;font-family:'Segoe UI Symbol','Segoe UI',Arial,Helvetica,sans-serif"
       id="g61"
       transform="translate(180,80)">

<!-- Background -->
<rect width="60" height="40" fill="#ffffff" id="rect1" x="0" y="0"/>

<!-- ========== LEFT SIDE: Naïve ========== -->
<text x="14.5" y="2.8" text-anchor="middle" fill="#9e9e9e" font-weight="bold">Naïve</text>
<text x="14.5" y="5.3" text-anchor="middle" fill="#bdbdbd" font-style="italic">No prior task</text>

<!-- Cell population (dashed ellipse) -->
<ellipse cx="14.5" cy="12.5" rx="9.5" ry="7" fill="#fafafa" stroke="#cccccc" stroke-width="0.25" stroke-dasharray="1, 0.7"/>

<!-- 12 cells: muted mix of red/blue/gray — low contrast, no strong differentiation -->
<circle cx="8.5" cy="9" r="1.2" fill="#ffcdd2" stroke="#e0a0a0" stroke-width="0.2"/>
<circle cx="13" cy="8.5" r="1.2" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.2"/>
<circle cx="17.5" cy="8.5" r="1.2" fill="#d1d5ed" stroke="#b0b8d4" stroke-width="0.2"/>
<circle cx="22" cy="9" r="1.2" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.2"/>
<circle cx="7" cy="13" r="1.2" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.2"/>
<circle cx="11.5" cy="13" r="1.2" fill="#f0c8c8" stroke="#d4a0a0" stroke-width="0.2"/>
<circle cx="16" cy="13" r="1.2" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.2"/>
<circle cx="20.5" cy="13" r="1.2" fill="#dcdef0" stroke="#b8bcd8" stroke-width="0.2"/>
<circle cx="8.5" cy="17" r="1.2" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.2"/>
<circle cx="13" cy="17" r="1.2" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.2"/>
<circle cx="17.5" cy="17" r="1.2" fill="#f0c8c8" stroke="#d4a0a0" stroke-width="0.2"/>
<circle cx="22" cy="17" r="1.2" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.2"/>

<!-- Mini calcium traces: symmetric responses (all cells similar) -->
<!-- Stimulus onset marker -->
<line x1="10" y1="20.3" x2="10" y2="24.5" stroke="#bdbdbd" stroke-width="0.25" stroke-dasharray="0.4,0.3"/>
<!-- Cell traces: tightly bundled, muted colors (low SD, very small amplitude) -->
<polyline points="7.5,24 9,24 10,23.8 10.8,23.4 11.5,23.2 12.5,23.4 13.5,23.7 14.5,23.9 16,24 21,24" fill="none" stroke="#d4a0a0" stroke-width="0.25" stroke-linejoin="round"/>
<polyline points="7.5,23.9 9,23.9 10,23.7 10.8,23.5 11.5,23.4 12.5,23.5 13.5,23.7 14.5,23.8 16,23.9 21,23.9" fill="none" stroke="#d4a0a0" stroke-width="0.25" stroke-linejoin="round" opacity="0.6"/>
<polyline points="7.5,24.1 9,24.1 10,24.2 10.8,24.4 11.5,24.5 12.5,24.4 13.5,24.3 14.5,24.2 16,24.1 21,24.1" fill="none" stroke="#8dbbe6" stroke-width="0.25" stroke-linejoin="round" opacity="0.7"/>

<!-- Output node: ? (no differentiation) -->
<circle cx="14.5" cy="27" r="1.8" fill="#d9ebf7" stroke="#0070c0" stroke-width="0.25"/>
<text x="14.5" y="27.7" text-anchor="middle" fill="#0070c0" font-weight="bold">?</text>

<!-- Labels -->
<text x="14.5" y="30.5" text-anchor="middle" fill="#9e9e9e" font-style="italic">No reference baseline</text>
<text x="14.5" y="33" text-anchor="middle" fill="#9e9e9e" font-style="italic">Symmetric responses</text>
<text x="14.5" y="37.5" text-anchor="middle" fill="#9e9e9e" font-weight="bold">Low SD</text>

<!-- ========== DIVIDER ========== -->
<line x1="30" y1="1.5" x2="30" y2="39" stroke="#e0e0e0" stroke-width="0.25"/>

<!-- ========== RIGHT SIDE: Transfer ========== -->
<text x="45" y="2.8" text-anchor="middle" fill="#c62828" font-weight="bold">Transfer</text>

<!-- Prior task inset box -->
<rect x="36" y="4.8" width="18" height="4.2" rx="0.8" fill="#fff4df" stroke="#f39800" stroke-width="0.25"/>
<text x="45" y="6.4" text-anchor="middle" fill="#f39800" font-weight="bold">Task 1 result</text>
<!-- 4 cells showing task 1 outcome: 2 active (deep red) + 1 negative (blue-purple) + 1 inactive (gray) -->
<circle cx="39" cy="7.9" r="0.7" fill="#e60012" stroke="#e60012" stroke-width="0.25"/>
<circle cx="42" cy="7.9" r="0.7" fill="#f6c9cf" stroke="#e60012" stroke-width="0.25"/>
<circle cx="48" cy="7.9" r="0.7" fill="#d9ebf7" stroke="#0070c0" stroke-width="0.25"/>
<circle cx="51" cy="7.9" r="0.7" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.25"/>

<!-- Retention arrow is drawn BEFORE ellipse text but we move it below -->

<!-- Cell population (dashed ellipse, shifted down for inset) -->
<ellipse cx="45" cy="16" rx="9.5" ry="5.5" fill="#fafafa" stroke="#cccccc" stroke-width="0.25" stroke-dasharray="1, 0.7"/>

<!-- Downward retention arrow (drawn AFTER ellipse so not covered) -->
<line x1="45" y1="9" x2="45" y2="10.8" stroke="#b71c1c" stroke-width="0.3"/>
<polygon points="44.4,10.4 45,11.3 45.6,10.4" fill="#b71c1c"/>
<text x="48" y="10" fill="#b71c1c" font-style="italic">Retained</text>

<!-- 12 heterogeneous cells: Row 1 matches Task 1 result (high contrast), Rows 2-3 fade to gray -->
<!-- Row 1: directly below Retained — matching Task 1 result colors -->
<circle cx="39" cy="12.5" r="1.2" fill="#b71c1c" stroke="#7f0000" stroke-width="0.25"/>
<circle cx="43.5" cy="12.5" r="1.2" fill="#f6c9cf" stroke="#e60012" stroke-width="0.25"/>
<circle cx="48" cy="12.5" r="1.2" fill="#d9ebf7" stroke="#0070c0" stroke-width="0.25"/>
<circle cx="52" cy="12.5" r="1.2" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.2"/>
<!-- Row 2: fading — lighter versions of above -->
<circle cx="37.5" cy="16" r="1.2" fill="#f6c9cf" stroke="#e60012" stroke-width="0.25"/>
<circle cx="42" cy="16" r="1.2" fill="#d9ebf7" stroke="#0070c0" stroke-width="0.25"/>
<circle cx="46.5" cy="16" r="1.2" fill="#eeeeee" stroke="#bdbdbd" stroke-width="0.2"/>
<circle cx="51" cy="16" r="1.2" fill="#eeeeee" stroke="#bdbdbd" stroke-width="0.2"/>
<!-- Row 3: mostly gray -->
<circle cx="39" cy="19.5" r="1.2" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.2"/>
<circle cx="43.5" cy="19.5" r="1.2" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.2"/>
<circle cx="48" cy="19.5" r="1.2" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.2"/>
<circle cx="52" cy="19.5" r="1.2" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.2"/>

<!-- Mini calcium traces: symmetry breaking (cells differ greatly) -->
<!-- Stimulus onset marker -->
<line x1="40" y1="22" x2="40" y2="26.2" stroke="#bdbdbd" stroke-width="0.25" stroke-dasharray="0.4,0.3"/>
<!-- Cell A: inherited, strong positive response (dark red) -->
<polyline points="37.5,25.5 39,25.5 40,24.5 40.8,23 41.5,22 42.5,23 43.5,24 44.5,25 46,25.5 53,25.5" fill="none" stroke="#b71c1c" stroke-width="0.3" stroke-linejoin="round"/>
<!-- Cell B: moderate positive (pink) -->
<polyline points="37.5,25.5 39,25.5 40,25.2 40.8,24.5 41.5,24 42.5,24.5 43.5,25 44.5,25.3 46,25.5 53,25.5" fill="none" stroke="#f6c9cf" stroke-width="0.25" stroke-linejoin="round"/>
<!-- Cell C: negative response (blue-gray, goes down) -->
<polyline points="37.5,25.5 39,25.5 40,25.8 40.8,26.5 41.5,27 42.5,26.8 43.5,26.2 44.5,25.8 46,25.5 53,25.5" fill="none" stroke="#0070c0" stroke-width="0.25" stroke-linejoin="round"/>
<!-- Cell D: flat / inactive (gray) -->
<polyline points="37.5,25.5 39,25.5 40,25.4 40.8,25.5 41.5,25.5 42.5,25.5 43.5,25.5 44.5,25.5 46,25.5 53,25.5" fill="none" stroke="#bdbdbd" stroke-width="0.2" stroke-linejoin="round"/>

<!-- TH modulation: acts on cell population via multiple faint arrows to extreme cells -->
<rect x="54.5" y="14" width="5" height="3" rx="0.8" fill="#fff4df" stroke="#f39800" stroke-width="0.25"/>
<text x="57" y="16" text-anchor="middle" fill="#f39800" font-weight="bold">TH</text>
<!-- Arrow to Row 1 strong red cell (cx=39, cy=12.5) -->
<line x1="54.5" y1="14.5" x2="40.4" y2="12.5" stroke="#f39800" stroke-width="0.25" stroke-dasharray="0.6,0.4" opacity="0.5"/>
<polygon points="40.8,12.1 40.1,12.5 40.8,12.9" fill="#f39800" opacity="0.5"/>
<!-- Arrow to Row 1 second red cell (cx=43.5, cy=12.5) -->
<line x1="54.5" y1="14.8" x2="44.9" y2="12.7" stroke="#f39800" stroke-width="0.25" stroke-dasharray="0.6,0.4" opacity="0.4"/>
<polygon points="45.3,12.3 44.6,12.7 45.3,13.1" fill="#f39800" opacity="0.4"/>
<!-- Arrow to Row 1 blue cell (cx=48, cy=12.5) -->
<line x1="54.5" y1="14.6" x2="49.4" y2="12.7" stroke="#f39800" stroke-width="0.25" stroke-dasharray="0.6,0.4" opacity="0.45"/>
<polygon points="49.8,12.3 49.1,12.7 49.8,13.1" fill="#f39800" opacity="0.45"/>
<!-- Arrow to Row 2 red cell (cx=37.5, cy=16) — main arrow, slightly stronger -->
<line x1="54.5" y1="15.5" x2="38.9" y2="16" stroke="#e65100" stroke-width="0.25" stroke-dasharray="0.8,0.4" opacity="0.6"/>
<polygon points="39.3,15.6 38.6,16 39.3,16.4" fill="#e65100" opacity="0.6"/>
<!-- Arrow to Row 2 blue cell (cx=42, cy=16) -->
<line x1="54.5" y1="15.8" x2="43.4" y2="16.1" stroke="#f39800" stroke-width="0.25" stroke-dasharray="0.6,0.4" opacity="0.4"/>
<polygon points="43.8,15.7 43.1,16.1 43.8,16.5" fill="#f39800" opacity="0.4"/>

<!-- Output node: checkmark -->
<circle cx="45" cy="28" r="1.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="0.25"/>
<text x="45" y="28.8" text-anchor="middle" fill="#2e7d32" font-weight="bold">✓</text>

<!-- Labels -->
<text x="45" y="31.5" text-anchor="middle" fill="#2e7d32" font-style="italic">Prior traces as reference</text>
<text x="45" y="34" text-anchor="middle" fill="#2e7d32" font-style="italic">Symmetry breaking</text>
<text x="45" y="37.5" text-anchor="middle" fill="#2e7d32" font-weight="bold">High SD (TH-mediated)</text>

</g></g></svg>
