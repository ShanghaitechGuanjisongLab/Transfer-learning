<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #16324f; }
      .subtitle { font: 600 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #355070; }
      .label { font: 600 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1f2937; }
      .text { font: 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #243b53; }
      .small { font: 13px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #486581; }
      .box-blue { fill: #e8f1fb; stroke: #4f86c6; stroke-width: 2; }
      .box-green { fill: #e8f7ef; stroke: #4ea37b; stroke-width: 2; }
      .box-orange { fill: #fff1e6; stroke: #e07a2f; stroke-width: 2; }
      .box-purple { fill: #f3ebff; stroke: #8661c1; stroke-width: 2; }
      .box-red { fill: #fdecec; stroke: #cc4b4b; stroke-width: 2; }
      .box-gray { fill: #f6f7f9; stroke: #7b8794; stroke-width: 2; }
      .group { fill: none; stroke: #cbd2d9; stroke-width: 2; stroke-dasharray: 8 6; }
      .arrow { stroke: #52606d; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #7b8794; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-red { stroke: #cc4b4b; stroke-width: 2.4; fill: none; marker-end: url(#arrowRed); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#52606d"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#cc4b4b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1180" fill="#ffffff"/>
  <text x="60" y="60" class="title">响应异质性的产生及其与学习速度增加的关系</text>
  <text x="60" y="95" class="subtitle">基于 4.2-4.5：差异化抑制、双通道学习、丘脑可塑性门控、隔夜衰减</text>

  <rect x="50" y="130" width="1500" height="390" rx="22" class="group"/>
  <text x="75" y="160" class="subtitle">一、响应异质性如何产生</text>

  <rect x="90" y="190" width="240" height="90" rx="16" class="box-blue"/>
  <text x="210" y="225" text-anchor="middle" class="label">后部丘脑 PO 输入</text>
  <text x="210" y="250" text-anchor="middle" class="text">提供高阶丘脑驱动</text>

  <rect x="390" y="190" width="270" height="90" rx="16" class="box-blue"/>
  <text x="525" y="225" text-anchor="middle" class="label">前馈抑制回路被激活</text>
  <text x="525" y="250" text-anchor="middle" class="text">PV+/SOM+ 中间神经元参与</text>

  <rect x="720" y="190" width="310" height="90" rx="16" class="box-blue"/>
  <text x="875" y="225" text-anchor="middle" class="label">差异化抑制施加到锥体细胞</text>
  <text x="875" y="250" text-anchor="middle" class="text">不同细胞承受不均匀抑制</text>

  <rect x="1090" y="190" width="360" height="90" rx="16" class="box-green"/>
  <text x="1270" y="225" text-anchor="middle" class="label">群体响应分布被拉开</text>
  <text x="1270" y="250" text-anchor="middle" class="text">正响应与负响应亚群分化增强</text>

  <path d="M330 235 L390 235" class="arrow"/>
  <path d="M660 235 L720 235" class="arrow"/>
  <path d="M1030 235 L1090 235" class="arrow"/>

  <rect x="180" y="345" width="290" height="100" rx="16" class="box-purple"/>
  <text x="325" y="380" text-anchor="middle" class="label">高阶丘脑可塑性门控</text>
  <text x="325" y="405" text-anchor="middle" class="text">L1 与顶树突 NMDAR 窗口开放</text>

  <rect x="560" y="330" width="290" height="130" rx="16" class="box-orange"/>
  <text x="705" y="365" text-anchor="middle" class="label">Schema 通道</text>
  <text x="705" y="390" text-anchor="middle" class="text">旧经验留下的结构与回路偏好</text>
  <text x="705" y="415" text-anchor="middle" class="text">使新线索可直接接入既有输出框架</text>

  <rect x="940" y="330" width="290" height="130" rx="16" class="box-orange"/>
  <text x="1085" y="365" text-anchor="middle" class="label">Coactivity 通道</text>
  <text x="1085" y="390" text-anchor="middle" class="text">当前任务相关细胞协同活动</text>
  <text x="1085" y="415" text-anchor="middle" class="text">驱动 eligibility trace 积累</text>

  <rect x="1280" y="345" width="220" height="100" rx="16" class="box-green"/>
  <text x="1390" y="380" text-anchor="middle" class="label">分化模式被写入回路</text>
  <text x="1390" y="405" text-anchor="middle" class="text">跨会话稳定性增强</text>

  <path d="M325 280 L325 345" class="arrow-soft"/>
  <path d="M470 395 L560 395" class="arrow"/>
  <path d="M850 395 L940 395" class="arrow"/>
  <path d="M1230 395 L1280 395" class="arrow"/>
  <path d="M325 445 C325 480, 640 500, 1390 445" class="arrow-soft"/>

  <rect x="470" y="560" width="300" height="110" rx="16" class="box-green"/>
  <text x="620" y="595" text-anchor="middle" class="label">响应方向跨会话不易翻转</text>
  <text x="620" y="620" text-anchor="middle" class="text">平均后正负响应不再相互抵消</text>

  <rect x="840" y="560" width="290" height="110" rx="16" class="box-green"/>
  <text x="985" y="595" text-anchor="middle" class="label">响应异质性升高</text>
  <text x="985" y="620" text-anchor="middle" class="text">群体分化被统计量捕获</text>

  <path d="M1390 445 L1390 505 L985 505 L985 560" class="arrow"/>
  <path d="M770 615 L840 615" class="arrow"/>

  <rect x="50" y="710" width="1500" height="250" rx="22" class="group"/>
  <text x="75" y="740" class="subtitle">二、为什么异质性高时学习速度更快</text>

  <rect x="120" y="785" width="300" height="95" rx="16" class="box-green"/>
  <text x="270" y="820" text-anchor="middle" class="label">任务相关群体结构更清晰</text>
  <text x="270" y="845" text-anchor="middle" class="text">可被稳定招募的细胞集合更明确</text>

  <rect x="500" y="785" width="300" height="95" rx="16" class="box-orange"/>
  <text x="650" y="820" text-anchor="middle" class="label">有效共激活更集中</text>
  <text x="650" y="845" text-anchor="middle" class="text">eligibility 更容易在正确连接上累积</text>

  <rect x="880" y="785" width="280" height="95" rx="16" class="box-orange"/>
  <text x="1020" y="820" text-anchor="middle" class="label">学习增量更大</text>
  <text x="1020" y="845" text-anchor="middle" class="text">Schema 与 Coactivity 更高效写入</text>

  <rect x="1240" y="785" width="240" height="95" rx="16" class="box-green"/>
  <text x="1360" y="820" text-anchor="middle" class="label">学习速度增加</text>
  <text x="1360" y="845" text-anchor="middle" class="text">更快达到行为 ceiling</text>

  <path d="M1130 615 L1130 690 L270 690 L270 785" class="arrow-soft"/>
  <path d="M420 832 L500 832" class="arrow"/>
  <path d="M800 832 L880 832" class="arrow"/>
  <path d="M1160 832 L1240 832" class="arrow"/>

  <rect x="50" y="995" width="1500" height="135" rx="22" class="group"/>
  <text x="75" y="1025" class="subtitle">三、跨日维持与 TH 抑制效应</text>

  <rect x="120" y="1055" width="300" height="90" rx="16" class="box-gray"/>
  <text x="270" y="1090" text-anchor="middle" class="label">隔夜突触衰减</text>
  <text x="270" y="1115" text-anchor="middle" class="text">睡眠后学习表征部分下调</text>

  <rect x="500" y="1055" width="310" height="90" rx="16" class="box-gray"/>
  <text x="655" y="1090" text-anchor="middle" class="label">若无 schema 保护</text>
  <text x="655" y="1115" text-anchor="middle" class="text">跨日分化被部分抹平，行为更易折返</text>

  <rect x="890" y="1055" width="280" height="90" rx="16" class="box-green"/>
  <text x="1030" y="1090" text-anchor="middle" class="label">schema 保留加成</text>
  <text x="1030" y="1115" text-anchor="middle" class="text">Transfer 组隔夜损失更小</text>

  <rect x="1250" y="1055" width="240" height="90" rx="16" class="box-red"/>
  <text x="1370" y="1090" text-anchor="middle" class="label">TH 抑制</text>
  <text x="1370" y="1115" text-anchor="middle" class="text">差异化抑制与可塑性门控同时减弱</text>

  <path d="M420 1100 L500 1100" class="arrow"/>
  <path d="M810 1100 L890 1100" class="arrow"/>
  <path d="M1170 1100 L1250 1100" class="arrow-red"/>
  <path d="M655 1055 L655 945 L985 945 L985 670" class="arrow-soft"/>
  <path d="M1030 1055 L1030 945 L1360 945 L1360 880" class="arrow-soft"/>
  <path d="M1370 1055 L1370 945 L985 945 L985 670" class="arrow-red"/>
  <path d="M1490 1100 L1490 945 L1360 945 L1360 880" class="arrow-red"/>

  <text x="60" y="1160" class="small">说明：异质性并非直接导致学习变快，而是与学习速度共同反映“学习相关神经集群的功能组织强度”。</text>
</svg>