<!-- ==================== BOTTOM: Sample Efficiency Explanation ==================== -->
<g transform="translate(0, 380)">

  <line x1="25" y1="0" x2="835" y2="0" stroke="#ddd"/>

  <text x="430" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">
    Consequence for learning speed: sample efficiency of the readout
  </text>

  <!-- Left box: Low SD -->
  <g transform="translate(25, 36)">
    <rect x="0" y="0" width="390" height="95" rx="4" fill="#FFF5F5" stroke="#F0D0D0"/>
    <text x="195" y="18" text-anchor="middle" font-size="11" fill="#C04040" font-weight="bold">
      Naive: low SD → d_eff ≈ 1
    </text>
    <text x="195" y="36" text-anchor="middle" font-size="10" fill="#666">
      All weakly responsive cells fire at ≈ 0 → nearly identical
    </text>
    <text x="195" y="52" text-anchor="middle" font-size="10" fill="#666">
      Downstream readout sees 1 effective dimension
    </text>
    <text x="195" y="68" text-anchor="middle" font-size="10" fill="#666">
      Cannot distinguish Hit vs Miss conditions
    </text>
    <text x="195" y="86" text-anchor="middle" font-size="10.5" fill="#C04040" font-weight="bold">
      → Many sessions needed, ΔHit small
    </text>
  </g>

  <!-- Right box: High SD -->
  <g transform="translate(445, 36)">
    <rect x="0" y="0" width="390" height="95" rx="4" fill="#F0FFF0" stroke="#C0E8C0"/>
    <text x="195" y="18" text-anchor="middle" font-size="11" fill="#2E7D32" font-weight="bold">
      Transfer: high SD → d_eff moderate
    </text>
    <text x="195" y="36" text-anchor="middle" font-size="10" fill="#666">
      Inherited cells diversify weakly responsive population
    </text>
    <text x="195" y="52" text-anchor="middle" font-size="10" fill="#666">
      Responses spread along signal axis (structured, not noise)
    </text>
    <text x="195" y="68" text-anchor="middle" font-size="10" fill="#666">
      Readout finds separating boundary with few trials
    </text>
    <text x="195" y="86" text-anchor="middle" font-size="10.5" fill="#2E7D32" font-weight="bold">
      → Fewer sessions needed, ΔHit large
    </text>
  </g>

</g>

<!-- Legend -->
<g transform="translate(25, 490)">
  <circle cx="8" cy="8" r="4" fill="#E85757" fill-opacity="0.7"/>
  <text x="18" y="12" font-size="9.5" fill="#666">Hit trials</text>
  <circle cx="88" cy="8" r="4" fill="#4A90D9" fill-opacity="0.7"/>
  <text x="98" y="12" font-size="9.5" fill="#666">Miss trials</text>
  <line x1="170" y1="8" x2="195" y2="8" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="200" y="12" font-size="9.5" fill="#666">No valid boundary</text>
  <line x1="310" y1="8" x2="335" y2="8" stroke="#4CAF50" stroke-width="2.5"/>
  <text x="340" y="12" font-size="9.5" fill="#666">Linear readout boundary</text>

  <text x="530" y="12" font-size="9" fill="#aaa">
    Each dot = one cell's mean response across trials for a given condition
  </text>
</g>

