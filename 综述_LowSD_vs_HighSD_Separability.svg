<rect width="860" height="520" fill="white"/>

<!-- ==================== TITLE ==================== -->
<text x="430" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">
  Population Response Heterogeneity and Readout Separability
</text>
<text x="430" y="46" text-anchor="middle" font-size="11" fill="#888">
  Why high inter-cell SD in weakly responsive neurons enables faster learning
</text>

