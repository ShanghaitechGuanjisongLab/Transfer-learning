<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" font-family="Arial, Helvetica, sans-serif">

<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0,0 8,3 0,6" fill="#333"/>
  </marker>
</defs>

<rect width="820" height="530" fill="white"/>

<!-- ==================== TITLE ==================== -->
<text x="410" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">
  Mixed Selectivity: Dimension Expansion Enables Linear Separability
</text>
<text x="410" y="46" text-anchor="middle" font-size="11" fill="#888">
  4 conditions (2 variables x 2 levels); class depends on variable interaction (XOR logic)
</text>

<!-- ==================== LEFT PANEL ==================== -->
<g transform="translate(30, 58)">

  <rect x="0" y="0" width="340" height="310" rx="6" fill="#fafafa" stroke="#e0e0e0"/>

  <text x="170" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#C04040">
    Pure selectivity only (2D)
  </text>

  <!-- Y axis -->
  <line x1="65" y1="275" x2="65" y2="50" stroke="#aaa" stroke-width="1.2"/>
  <polygon points="65,50 61,57 69,57" fill="#aaa"/>
  <!-- X axis -->
  <line x1="65" y1="275" x2="310" y2="275" stroke="#aaa" stroke-width="1.2"/>
  <polygon points="310,275 303,271 303,279" fill="#aaa"/>

  <text x="187" y="298" text-anchor="middle" font-size="10" fill="#666">Neuron A (stimulus-selective)</text>
  <text x="28" y="165" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90,28,165)">Neuron B (rule-selective)</text>

  <!-- BL: A-low, B-low -> Go (red) -->
  <circle cx="130" cy="225" r="22" fill="#E85757" fill-opacity="0.12" stroke="#E85757" stroke-width="1.5"/>
  <circle cx="118" cy="232" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="136" cy="218" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="124" cy="220" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="140" cy="230" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="127" cy="236" r="3" fill="#E85757" fill-opacity="0.7"/>
  <text x="130" y="228" text-anchor="middle" font-size="10" fill="#C04040" font-weight="bold">Go</text>

  <!-- TL: A-low, B-high -> NoGo (blue) -->
  <circle cx="130" cy="95" r="22" fill="#4A90D9" fill-opacity="0.12" stroke="#4A90D9" stroke-width="1.5"/>
  <circle cx="118" cy="88" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="140" cy="92" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="125" cy="102" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="135" cy="85" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="128" cy="98" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <text x="130" y="98" text-anchor="middle" font-size="10" fill="#3070B0" font-weight="bold">NoGo</text>

  <!-- BR: A-high, B-low -> NoGo (blue) -->
  <circle cx="250" cy="225" r="22" fill="#4A90D9" fill-opacity="0.12" stroke="#4A90D9" stroke-width="1.5"/>
  <circle cx="238" cy="232" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="256" cy="218" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="244" cy="220" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="260" cy="230" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="248" cy="236" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <text x="250" y="228" text-anchor="middle" font-size="10" fill="#3070B0" font-weight="bold">NoGo</text>

  <!-- TR: A-high, B-high -> Go (red) -->
  <circle cx="250" cy="95" r="22" fill="#E85757" fill-opacity="0.12" stroke="#E85757" stroke-width="1.5"/>
  <circle cx="238" cy="88" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="256" cy="102" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="244" cy="85" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="260" cy="92" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="248" cy="98" r="3" fill="#E85757" fill-opacity="0.7"/>
  <text x="250" y="98" text-anchor="middle" font-size="10" fill="#C04040" font-weight="bold">Go</text>

  <!-- Failed boundary: dashed horizontal -->
  <line x1="75" y1="160" x2="300" y2="160" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="308" y="163" font-size="9" fill="#999">attempt</text>

  <!-- Misclassification marks -->
  <text x="278" y="85" text-anchor="middle" font-size="11" fill="#E85757" font-weight="bold">wrong</text>
  <text x="278" y="250" text-anchor="middle" font-size="11" fill="#4A90D9" font-weight="bold">wrong</text>

  <!-- Verdict -->
  <rect x="55" y="257" width="260" height="18" rx="3" fill="#FFF0F0" stroke="#E8C0C0"/>
  <text x="185" y="270" text-anchor="middle" font-size="10" fill="#C04040" font-weight="bold">
    No straight line can separate Go / NoGo
  </text>

</g>

<!-- ==================== MIDDLE ARROW ==================== -->
<g transform="translate(378, 168)">
  <rect x="0" y="0" width="60" height="52" rx="5" fill="#f0f5ff" stroke="#ccd"/>
  <text x="30" y="16" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">add 1</text>
  <text x="30" y="29" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">mixed</text>
  <text x="30" y="42" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">neuron</text>
</g>

<!-- ==================== RIGHT PANEL ==================== -->
<g transform="translate(450, 58)">

  <rect x="0" y="0" width="340" height="310" rx="6" fill="#f5faf5" stroke="#c0dcc0"/>

  <text x="170" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">
    + 1 Mixed selectivity neuron (3D)
  </text>

  <!-- Y axis -->
  <line x1="65" y1="275" x2="65" y2="50" stroke="#aaa" stroke-width="1.2"/>
  <polygon points="65,50 61,57 69,57" fill="#aaa"/>
  <!-- X axis -->
  <line x1="65" y1="275" x2="310" y2="275" stroke="#aaa" stroke-width="1.2"/>
  <polygon points="310,275 303,271 303,279" fill="#aaa"/>

  <text x="187" y="298" text-anchor="middle" font-size="10" fill="#666">Original pure-selective axis</text>
  <text x="28" y="165" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90,28,165)">Mixed neuron (A x B)</text>

  <!-- Y axis ticks -->
  <text x="55" y="232" text-anchor="end" font-size="9" fill="#999">-1</text>
  <line x1="60" y1="228" x2="65" y2="228" stroke="#ccc"/>
  <text x="55" y="163" text-anchor="end" font-size="9" fill="#999">0</text>
  <line x1="60" y1="160" x2="65" y2="160" stroke="#ccc"/>
  <text x="55" y="100" text-anchor="end" font-size="9" fill="#999">+1</text>
  <line x1="60" y1="96" x2="65" y2="96" stroke="#ccc"/>

  <!-- Region shading -->
  <rect x="66" y="51" width="243" height="109" fill="#E85757" fill-opacity="0.04"/>
  <rect x="66" y="161" width="243" height="114" fill="#4A90D9" fill-opacity="0.04"/>

  <!-- Linear boundary -->
  <line x1="70" y1="160" x2="305" y2="160" stroke="#4CAF50" stroke-width="2.5"/>
  <text x="312" y="155" font-size="9" fill="#4CAF50" font-weight="bold">z = 0</text>

  <!-- Go: BOTH at TOP (mixed = +1) -->
  <circle cx="130" cy="95" r="22" fill="#E85757" fill-opacity="0.12" stroke="#E85757" stroke-width="1.5"/>
  <circle cx="118" cy="88" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="136" cy="102" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="124" cy="85" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="140" cy="92" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="128" cy="100" r="3" fill="#E85757" fill-opacity="0.7"/>
  <text x="130" y="98" text-anchor="middle" font-size="10" fill="#C04040" font-weight="bold">Go</text>

  <circle cx="250" cy="95" r="22" fill="#E85757" fill-opacity="0.12" stroke="#E85757" stroke-width="1.5"/>
  <circle cx="238" cy="88" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="256" cy="102" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="244" cy="85" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="260" cy="92" r="3" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="248" cy="100" r="3" fill="#E85757" fill-opacity="0.7"/>
  <text x="250" y="98" text-anchor="middle" font-size="10" fill="#C04040" font-weight="bold">Go</text>

  <!-- NoGo: BOTH at BOTTOM (mixed = -1) -->
  <circle cx="130" cy="225" r="22" fill="#4A90D9" fill-opacity="0.12" stroke="#4A90D9" stroke-width="1.5"/>
  <circle cx="118" cy="232" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="140" cy="220" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="125" cy="218" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="135" cy="234" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="128" cy="228" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <text x="130" y="228" text-anchor="middle" font-size="10" fill="#3070B0" font-weight="bold">NoGo</text>

  <circle cx="250" cy="225" r="22" fill="#4A90D9" fill-opacity="0.12" stroke="#4A90D9" stroke-width="1.5"/>
  <circle cx="238" cy="232" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="260" cy="220" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="245" cy="218" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="255" cy="234" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="248" cy="228" r="3" fill="#4A90D9" fill-opacity="0.7"/>
  <text x="250" y="228" text-anchor="middle" font-size="10" fill="#3070B0" font-weight="bold">NoGo</text>

  <!-- Verdict -->
  <rect x="55" y="257" width="260" height="18" rx="3" fill="#F0FFF0" stroke="#C0E8C0"/>
  <text x="185" y="270" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="bold">
    One line (z=0) perfectly separates Go / NoGo
  </text>

</g>

<!-- ==================== BOTTOM ANNOTATION ==================== -->
<g transform="translate(0, 385)">

  <line x1="30" y1="0" x2="790" y2="0" stroke="#ddd"/>

  <text x="410" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">
    Why linear separability = fewer samples to learn?
  </text>

  <!-- Two comparison boxes -->
  <g transform="translate(30, 32)">
    <rect x="0" y="0" width="365" height="48" rx="4" fill="#FFF5F5" stroke="#F0D0D0"/>
    <text x="182" y="17" text-anchor="middle" font-size="11" fill="#C04040" font-weight="bold">
      Nonlinear classifier (left panel)
    </text>
    <text x="182" y="35" text-anchor="middle" font-size="10" fill="#777">
      Must fit complex surface; params ~ O(d^2); many trials needed
    </text>
  </g>

  <g transform="translate(425, 32)">
    <rect x="0" y="0" width="365" height="48" rx="4" fill="#F0FFF0" stroke="#C0E8C0"/>
    <text x="182" y="17" text-anchor="middle" font-size="11" fill="#2E7D32" font-weight="bold">
      Linear classifier (right panel)
    </text>
    <text x="182" y="35" text-anchor="middle" font-size="10" fill="#777">
      Only fit a hyperplane; params ~ O(d); converges in few trials
    </text>
  </g>

  <text x="410" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">
    Mapping to weakly responsive population in this study
  </text>

  <rect x="40" y="110" width="740" height="32" rx="4" fill="#F5F5FF" stroke="#D0D0E8"/>
  <text x="410" y="125" text-anchor="middle" font-size="10.5" fill="#444">
    Low SD = all weak cells ~ 0 (lack mixed dimensions, as left panel)
  </text>
  <text x="410" y="139" text-anchor="middle" font-size="10.5" fill="#444">
    High SD = cells diversified (equivalent to adding mixed dimensions, as right panel) = faster readout = faster learning
  </text>

</g>

</svg>
