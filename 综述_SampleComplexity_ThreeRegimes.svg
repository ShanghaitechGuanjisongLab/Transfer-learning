<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Arial, Helvetica, sans-serif">

<defs>
  <marker id="arrowBlk" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0,0 8,3 0,6" fill="#333"/>
  </marker>
  <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0,0 8,3 0,6" fill="#E67E00"/>
  </marker>
</defs>

<rect width="860" height="500" fill="white"/>

<!-- ==================== TITLE ==================== -->
<text x="430" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">
  Sample Complexity and Effective Dimensionality
</text>
<text x="430" y="44" text-anchor="middle" font-size="11" fill="#888">
  Three regimes of representation structure and their learning consequences (Sorscher 2022; Fusi 2016)
</text>

<!-- ==================== PANEL A: Collapsed ==================== -->
<g transform="translate(15, 65)">

  <rect x="0" y="0" width="270" height="260" rx="6" fill="#fef5f5" stroke="#f0d0d0"/>
  <text x="135" y="20" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#C04040">
    A. Collapsed (d_eff ≈ 1)
  </text>
  <text x="135" y="36" text-anchor="middle" font-size="9.5" fill="#888">
    All cells respond identically
  </text>

  <!-- Axes -->
  <line x1="50" y1="220" x2="50" y2="50" stroke="#bbb" stroke-width="1"/>
  <polygon points="50,50 47,56 53,56" fill="#bbb"/>
  <line x1="50" y1="220" x2="250" y2="220" stroke="#bbb" stroke-width="1"/>
  <polygon points="250,220 244,217 244,223" fill="#bbb"/>
  <text x="150" y="238" text-anchor="middle" font-size="9" fill="#888">dim 1</text>
  <text x="30" y="135" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90,30,135)">dim 2</text>

  <!-- All points collapsed on a line (dim1 axis only) -->
  <!-- Class A (red) -->
  <circle cx="138" cy="138" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="144" cy="140" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="141" cy="135" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="147" cy="137" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="135" cy="141" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="150" cy="139" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="132" cy="136" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <!-- Class B (blue) -->
  <circle cx="140" cy="132" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="146" cy="134" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="137" cy="137" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="143" cy="141" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="149" cy="136" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="133" cy="139" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="152" cy="133" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>

  <!-- Spread indicator (tiny) -->
  <line x1="128" y1="127" x2="156" y2="127" stroke="#C04040" stroke-width="1"/>
  <line x1="128" y1="125" x2="128" y2="129" stroke="#C04040" stroke-width="1"/>
  <line x1="156" y1="125" x2="156" y2="129" stroke="#C04040" stroke-width="1"/>
  <text x="142" y="123" text-anchor="middle" font-size="8" fill="#C04040">tiny spread</text>

  <!-- Verdict -->
  <rect x="15" y="195" width="240" height="20" rx="3" fill="#FFF0F0" stroke="#E8C0C0"/>
  <text x="135" y="209" text-anchor="middle" font-size="9.5" fill="#C04040" font-weight="bold">
    ❌ Cannot distinguish classes at all
  </text>

</g>

<!-- ==================== PANEL B: Fully Expanded ==================== -->
<g transform="translate(298, 65)">

  <rect x="0" y="0" width="270" height="260" rx="6" fill="#fffcf0" stroke="#f0e0b0"/>
  <text x="135" y="20" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#B8860B">
    B. Fully expanded (d_eff = N)
  </text>
  <text x="135" y="36" text-anchor="middle" font-size="9.5" fill="#888">
    All cells fully independent — random
  </text>

  <!-- Axes -->
  <line x1="50" y1="220" x2="50" y2="50" stroke="#bbb" stroke-width="1"/>
  <polygon points="50,50 47,56 53,56" fill="#bbb"/>
  <line x1="50" y1="220" x2="250" y2="220" stroke="#bbb" stroke-width="1"/>
  <polygon points="250,220 244,217 244,223" fill="#bbb"/>
  <text x="150" y="238" text-anchor="middle" font-size="9" fill="#888">dim 1</text>
  <text x="30" y="135" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90,30,135)">dim 2</text>

  <!-- Class A (red) - scattered everywhere -->
  <circle cx="80" cy="78" r="3.5" fill="#E85757" fill-opacity="0.6"/>
  <circle cx="210" cy="180" r="3.5" fill="#E85757" fill-opacity="0.6"/>
  <circle cx="120" cy="195" r="3.5" fill="#E85757" fill-opacity="0.6"/>
  <circle cx="180" cy="75" r="3.5" fill="#E85757" fill-opacity="0.6"/>
  <circle cx="95" cy="145" r="3.5" fill="#E85757" fill-opacity="0.6"/>
  <circle cx="225" cy="110" r="3.5" fill="#E85757" fill-opacity="0.6"/>
  <circle cx="150" cy="165" r="3.5" fill="#E85757" fill-opacity="0.6"/>
  <circle cx="70" cy="185" r="3.5" fill="#E85757" fill-opacity="0.6"/>
  <circle cx="200" cy="65" r="3.5" fill="#E85757" fill-opacity="0.6"/>

  <!-- Class B (blue) - also scattered everywhere, overlapping -->
  <circle cx="100" cy="90" r="3.5" fill="#4A90D9" fill-opacity="0.6"/>
  <circle cx="190" cy="170" r="3.5" fill="#4A90D9" fill-opacity="0.6"/>
  <circle cx="140" cy="80" r="3.5" fill="#4A90D9" fill-opacity="0.6"/>
  <circle cx="75" cy="160" r="3.5" fill="#4A90D9" fill-opacity="0.6"/>
  <circle cx="220" cy="90" r="3.5" fill="#4A90D9" fill-opacity="0.6"/>
  <circle cx="160" cy="200" r="3.5" fill="#4A90D9" fill-opacity="0.6"/>
  <circle cx="110" cy="120" r="3.5" fill="#4A90D9" fill-opacity="0.6"/>
  <circle cx="230" cy="170" r="3.5" fill="#4A90D9" fill-opacity="0.6"/>
  <circle cx="85" cy="205" r="3.5" fill="#4A90D9" fill-opacity="0.6"/>

  <!-- Complex boundary (squiggly) -->
  <path d="M60,200 Q80,170 95,140 Q105,120 110,110 Q120,90 140,85 Q160,80 175,100 Q190,120 200,115 Q215,105 230,70 Q240,55 245,55" 
        fill="none" stroke="#B8860B" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="230" y="55" font-size="8" fill="#B8860B" font-weight="bold">complex boundary</text>

  <!-- Verdict -->
  <rect x="15" y="195" width="240" height="20" rx="3" fill="#FFFDE8" stroke="#E8DCA0"/>
  <text x="135" y="209" text-anchor="middle" font-size="9.5" fill="#B8860B" font-weight="bold">
    ⚠️ Separable, but needs O(N) samples
  </text>

</g>

<!-- ==================== PANEL C: Structured Expansion ==================== -->
<g transform="translate(580, 65)">

  <rect x="0" y="0" width="270" height="260" rx="6" fill="#f0faf0" stroke="#b0dab0"/>
  <text x="135" y="20" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2E7D32">
    C. Structured (d_eff moderate)
  </text>
  <text x="135" y="36" text-anchor="middle" font-size="9.5" fill="#888">
    Signal dims expanded, noise dims compressed
  </text>

  <!-- Axes -->
  <line x1="50" y1="220" x2="50" y2="50" stroke="#bbb" stroke-width="1"/>
  <polygon points="50,50 47,56 53,56" fill="#bbb"/>
  <line x1="50" y1="220" x2="250" y2="220" stroke="#bbb" stroke-width="1"/>
  <polygon points="250,220 244,217 244,223" fill="#bbb"/>
  <text x="150" y="238" text-anchor="middle" font-size="9" fill="#888">signal dim</text>
  <text x="30" y="135" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90,30,135)">noise dim</text>

  <!-- Class A (red) - elongated cluster top-right along signal axis -->
  <circle cx="175" cy="115" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="190" cy="120" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="200" cy="108" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="185" cy="125" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="210" cy="112" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="195" cy="103" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="220" cy="118" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="170" cy="110" r="3.5" fill="#E85757" fill-opacity="0.7"/>
  <circle cx="205" cy="122" r="3.5" fill="#E85757" fill-opacity="0.7"/>

  <!-- Ellipse around class A -->
  <ellipse cx="195" cy="114" rx="35" ry="14" fill="none" stroke="#E85757" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Class B (blue) - elongated cluster bottom-left along signal axis -->
  <circle cx="95" cy="155" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="110" cy="148" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="80" cy="162" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="120" cy="152" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="100" cy="160" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="88" cy="145" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="130" cy="158" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="75" cy="150" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>
  <circle cx="115" cy="165" r="3.5" fill="#4A90D9" fill-opacity="0.7"/>

  <!-- Ellipse around class B -->
  <ellipse cx="100" cy="155" rx="35" ry="14" fill="none" stroke="#4A90D9" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Signal direction arrow -->
  <line x1="80" y1="182" x2="220" y2="88" stroke="#E67E00" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowOrange)"/>
  <text x="170" y="160" font-size="8.5" fill="#E67E00" font-weight="bold" transform="rotate(-42,170,160)">high aspect ratio</text>

  <!-- Clean linear boundary -->
  <line x1="80" y1="85" x2="230" y2="195" stroke="#4CAF50" stroke-width="2.5"/>
  <text x="238" y="197" font-size="8.5" fill="#4CAF50" font-weight="bold">boundary</text>

  <!-- Margin annotation -->
  <line x1="158" y1="128" x2="140" y2="143" stroke="#4CAF50" stroke-width="0.8"/>
  <text x="125" y="139" text-anchor="end" font-size="8" fill="#4CAF50">wide margin</text>

  <!-- Verdict -->
  <rect x="15" y="195" width="240" height="20" rx="3" fill="#F0FFF0" stroke="#C0E8C0"/>
  <text x="135" y="209" text-anchor="middle" font-size="9.5" fill="#2E7D32" font-weight="bold">
    ✅ Clean separation with few samples
  </text>

</g>

<!-- ==================== BOTTOM: Mapping to this study ==================== -->
<g transform="translate(0, 345)">

  <line x1="15" y1="0" x2="845" y2="0" stroke="#ddd"/>

  <text x="430" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">
    Mapping to weakly responsive population (|z@1s| ≤ 1)
  </text>

  <!-- Three mapping boxes -->
  <g transform="translate(15, 34)">
    <rect x="0" y="0" width="270" height="60" rx="4" fill="#FFF5F5" stroke="#F0D0D0"/>
    <text x="135" y="16" text-anchor="middle" font-size="10" fill="#C04040" font-weight="bold">
      Regime A = Naive, uniform silence
    </text>
    <text x="135" y="32" text-anchor="middle" font-size="9.5" fill="#666">
      All Moderates fire ≈ 0 → d_eff ≈ 1
    </text>
    <text x="135" y="48" text-anchor="middle" font-size="9.5" fill="#666">
      No task information → cannot learn
    </text>
  </g>

  <g transform="translate(298, 34)">
    <rect x="0" y="0" width="270" height="60" rx="4" fill="#FFFDE8" stroke="#E8DCA0"/>
    <text x="135" y="16" text-anchor="middle" font-size="10" fill="#B8860B" font-weight="bold">
      Regime B = random noise in population
    </text>
    <text x="135" y="32" text-anchor="middle" font-size="9.5" fill="#666">
      Heterogeneous but unstructured → d_eff = N
    </text>
    <text x="135" y="48" text-anchor="middle" font-size="9.5" fill="#666">
      Theoretically separable, slow convergence
    </text>
  </g>

  <g transform="translate(580, 34)">
    <rect x="0" y="0" width="270" height="60" rx="4" fill="#F0FFF0" stroke="#C0E8C0"/>
    <text x="135" y="16" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="bold">
      Regime C = Transfer, structured diversity
    </text>
    <text x="135" y="32" text-anchor="middle" font-size="9.5" fill="#666">
      Inherited cells diversify along signal axis
    </text>
    <text x="135" y="48" text-anchor="middle" font-size="9.5" fill="#666">
      SD ↑ but Div ↓ → optimal aspect ratio → ΔHit ↑
    </text>
  </g>

  <!-- Arrow highlighting the one that matches -->
  <text x="430" y="114" text-anchor="middle" font-size="11" fill="#2E7D32" font-weight="bold">
    Prior AudioWater experience moves the population from regime A → regime C
  </text>
  <line x1="150" y1="108" x2="700" y2="108" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#arrowBlk)"/>

</g>

<!-- Legend -->
<g transform="translate(15, 472)">
  <circle cx="8" cy="8" r="4" fill="#E85757" fill-opacity="0.7"/>
  <text x="18" y="12" font-size="9" fill="#666">Class A (e.g., Hit trials)</text>
  <circle cx="160" cy="8" r="4" fill="#4A90D9" fill-opacity="0.7"/>
  <text x="170" y="12" font-size="9" fill="#666">Class B (e.g., Miss trials)</text>
  <line x1="310" y1="8" x2="330" y2="8" stroke="#4CAF50" stroke-width="2.5"/>
  <text x="336" y="12" font-size="9" fill="#666">Linear boundary</text>
  <line x1="420" y1="8" x2="440" y2="8" stroke="#B8860B" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="446" y="12" font-size="9" fill="#666">Complex boundary</text>

  <text x="600" y="12" font-size="8.5" fill="#aaa">
    Based on Sorscher et al. 2022 PNAS; Fusi et al. 2016 CONB
  </text>
</g>

</svg>
